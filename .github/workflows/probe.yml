name: "x:environment:production"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  a-test-workflow-first:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bb-830d18b9" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 - "$T" <<'PYEOF'
          import sys,base64,json
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ['sub','workflow','workflow_ref','job_workflow_ref','repository','environment','event_name']:
              print('CLAIM',k,'=',repr(c.get(k)))
          PYEOF
  b-poscontrol-environment-colon:
    runs-on: ubuntu-latest
    environment: "x:ref:refs/heads/main"
    steps:
      - run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bb-830d18b9" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 - "$T" <<'PYEOF'
          import sys,base64,json
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ['sub','workflow','workflow_ref','job_workflow_ref','repository','environment','event_name']:
              print('CLAIM',k,'=',repr(c.get(k)))
          PYEOF
  c-negcontrol-inert-chars:
    runs-on: ubuntu-latest
    environment: "prod@999*x"
    steps:
      - run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bb-830d18b9" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 - "$T" <<'PYEOF'
          import sys,base64,json
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ['sub','workflow','workflow_ref','job_workflow_ref','repository','environment','event_name']:
              print('CLAIM',k,'=',repr(c.get(k)))
          PYEOF
